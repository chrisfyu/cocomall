spring.application.name=cocomall-coupon

management.endpoints.web.exposure.include=*
feign.sentinel.enabled=true

spring.redis.host=redis.cocomall
spring.cloud.sentinel.transport.dashboard=sentinel-service.cocomall:8333
spring.cloud.nacos.discovery.server-addr=nacos-service.cocomall:8848
spring.zipkin.base-url=http://zipkin-service.cocomall:9411/
spring.datasource.url=jdbc:mysql://mysql-master.cocomall:3306/cocomall_sms

#服务追踪
#关闭服务发现
spring.zipkin.discovery-client-enabled=false
spring.zipkin.sender.type=web
#配置采样器
spring.sleuth.sampler.probability=1


spring.datasource.username=root
spring.datasource.password=123456
#spring.datasource.url=jdbc:mysql://mysql-master.cocomall:3306/cocomall_sms
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

mybatis-plus.mapper-locations=classpath:/mapper/**/*.xml
mybatis-plus.global-config.db-config.id-type=auto

server.port=8080